
spring.application.name=api_gateway

server.port=${server_port:8080}

# =========================
# USER SERVICE API
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# USER SERVICE OPENAPI
spring.cloud.gateway.server.webflux.routes[1].id=user-openapi
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/openapi/user/v1/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

# =========================
# PRODUCT SERVICE API
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/products/**

# PRODUCT SERVICE OPENAPI
spring.cloud.gateway.server.webflux.routes[3].id=product-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/openapi/product/v1/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

# =========================
# ORDER SERVICE API
# =========================
spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/orders/**

# ORDER SERVICE OPENAPI
spring.cloud.gateway.server.webflux.routes[5].id=order-openapi
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/openapi/order/v1/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

# =========================
# PAYMENT SERVICE API
# =========================
spring.cloud.gateway.server.webflux.routes[6].id=payment-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/payment/**

# PAYMENT SERVICE OPENAPI
spring.cloud.gateway.server.webflux.routes[7].id=payment-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/openapi/payment/v1/api-docs
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs

# =========================
# SWAGGER UI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/openapi/user/v1/api-docs

springdoc.swagger-ui.urls[1].name=Product Service
springdoc.swagger-ui.urls[1].url=/openapi/product/v1/api-docs

springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/openapi/order/v1/api-docs

springdoc.swagger-ui.urls[3].name=Payment Service
springdoc.swagger-ui.urls[3].url=/openapi/payment/v1/api-docs

springdoc.swagger-ui.urlsPrimaryName=User Service

# =========================
# ENVIRONMENT
# =========================
spring.config.import=optional:file:.env[.properties]
