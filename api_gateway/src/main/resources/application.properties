spring.application.name=api_gateway

server.port=${server_port}

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# User OpenApi
spring.cloud.gateway.server.webflux.routes[7].id=user-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/openapi/user/v1/api-docs
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/openapi/user/v1/api-docs

# Product Service API
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**

# Product OpenAPI
spring.cloud.gateway.server.webflux.routes[2].id=product-openapi
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/openapi/product/v1/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Product Service
springdoc.swagger-ui.urls[1].url=/openapi/product/v1/api-docs

# Order Service
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**

# Order OpenAPI
spring.cloud.gateway.server.webflux.routes[4].id=order-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/openapi/order/v1/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/openapi/order/v1/api-docs

# Payment Service
spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/payment/**

# Payment OpenApi
spring.cloud.gateway.server.webflux.routes[6].id=payment-openapi
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/openapi/payment/v1/api-docs
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[3].name=Payment Service
springdoc.swagger-ui.urls[3].url=/openapi/payment/v1/api-docs

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urlsPrimaryName=Product Service

spring.config.import=optional:file:.env[.properties]